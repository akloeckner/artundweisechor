name: Build Static Webserver Artifact

# Vorerst nur manuell starten: Actions → „Build Static Webserver Artifact“ → Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Statische Website bauen
        run: npm run build

      - name: Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: webserver-dist
          path: dist/client/
          retention-days: 14
