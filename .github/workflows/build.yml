name: Build Static Webserver Artifact

# Vorerst nur manuell starten: Actions → „Build Static Webserver Artifact“ → Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Bun einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      - name: Statische Website bauen
        run: bun run build

      - name: Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: webserver-dist
          path: dist/client/
          retention-days: 14
